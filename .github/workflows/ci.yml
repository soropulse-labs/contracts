name: Contract CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install --locked stellar-cli@28.1.0
      - run: stellar contract build --package soropulse-ticket-reservation --locked
      - uses: actions/upload-artifact@v4
        with:
          name: soropulse-ticket-reservation-wasm
          path: target/wasm32v1-none/release/soropulse_ticket_reservation.wasm
